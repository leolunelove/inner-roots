name: Verify and deploy Inner Roots
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  demo:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify gameplay and audio
        run: node verify.mjs && node verify-nerves.mjs && node verify-audio.mjs && node verify-demo.mjs && node verify-space.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
