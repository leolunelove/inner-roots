name: Verify and deploy Inner Roots
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify gameplay and audio
        run: node verify.mjs && node verify-nerves.mjs && node verify-audio.mjs && node verify-demo.mjs && node verify-space.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: ${{ env.ARTIFACT_NAME }}
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const endpoint=`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts`;
          let ready=false;
          for(let attempt=0;attempt<20;attempt++){
            const response=await fetch(endpoint,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
            if(!response.ok)throw new Error(`Artifact metadata request failed: ${response.status}`);
            const data=await response.json();
            if(data.artifacts.some(artifact=>artifact.name===process.env.ARTIFACT_NAME&&!artifact.expired)){ready=true;break}
            await new Promise(resolve=>setTimeout(resolve,2000));
          }
          if(!ready)throw new Error('Pages artifact metadata did not become available');
          console.log('Pages artifact metadata is ready');
          JS
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.ARTIFACT_NAME }}
